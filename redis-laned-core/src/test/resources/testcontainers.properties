# Testcontainers Docker configuration
docker.host=unix:///var/run/docker.sock
testcontainers.ryuk.disabled=true
testcontainers.reuse.enable=false

# CRITICAL: Override Docker API version for Docker 29.x (requires API 1.44+)
# docker-java 3.4.0 defaults to 1.32 which is too old
DOCKER_API_VERSION=1.44
